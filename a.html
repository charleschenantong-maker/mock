<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音轨提取器</title>
<style>
  :root{
    --bg:#0b0c0e; --panel:#17181c; --panel2:#1e2025; --border:rgba(255,255,255,.08);
    --text:#f0f0f2; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.4);
    --accent:#4E7FBE; --accent2:#5f92d1; --danger:#e0616b; --ok:#4caf7a;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px;
  }
  .wrap{ width:100%; max-width:560px; }
  h1{ font-size:1.15em; font-weight:750; margin:0 0 4px; }
  .sub{ color:var(--text2); font-size:.85em; margin:0 0 22px; line-height:1.6; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; }
  .drop{
    border:1.5px dashed rgba(255,255,255,.18); border-radius:14px; padding:30px 16px; text-align:center;
    cursor:pointer; transition:border-color .2s, background .2s;
  }
  .drop.dragover{ border-color:var(--accent); background:rgba(78,127,190,.08); }
  .drop svg{ width:34px; height:34px; color:var(--accent); opacity:.85; margin-bottom:10px; }
  .drop p{ margin:0; color:var(--text2); font-size:.88em; line-height:1.6; }
  .fname{ font-size:.85em; color:var(--text); word-break:break-all; margin-top:10px; }
  input[type=file]{ display:none; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 18px; border-radius:100px; border:none; cursor:pointer;
    background:var(--panel2); color:var(--text); font-size:.85em; font-weight:600;
    font-family:inherit; width:100%; margin-top:4px;
  }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .warn{
    font-size:.78em; color:#ffcf8a; background:rgba(255,180,80,.08); border:1px solid rgba(255,180,80,.25);
    border-radius:10px; padding:10px 12px; line-height:1.6; margin-top:12px; display:none;
  }
  .warn.show{ display:block; }
  .track{
    display:flex; align-items:center; gap:10px; padding:12px; border-radius:10px;
    border:1px solid var(--border); margin-bottom:8px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .track:hover{ background:var(--panel2); }
  .track.active{ border-color:var(--accent); background:rgba(78,127,190,.1); }
  .track input{ accent-color:var(--accent); width:16px; height:16px; flex-shrink:0; }
  .track .meta{ flex:1; min-width:0; }
  .track .t1{ font-size:.88em; font-weight:600; }
  .track .t2{ font-size:.76em; color:var(--text3); margin-top:2px; }
  .status{ font-size:.82em; color:var(--text2); text-align:center; margin-top:12px; min-height:1.4em; }
  .status.err{ color:var(--danger); }
  .status.ok{ color:var(--ok); }
  .progress-bar{ height:6px; border-radius:3px; background:var(--panel2); overflow:hidden; margin-top:10px; display:none; }
  .progress-bar.show{ display:block; }
  .progress-bar > div{ height:100%; width:0%; background:var(--accent); transition:width .2s ease; }
  a.dl{ text-decoration:none; }
  .log{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.7em; color:var(--text3);
    max-height:130px; overflow:auto; white-space:pre-wrap; background:#000; border-radius:8px; padding:8px 10px;
    margin-top:10px; display:none;
  }
  .log.show{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>音轨提取器</h1>
  <p class="sub">本地浏览器里跑（基于 ffmpeg.wasm），不上传到任何服务器。检测视频里有几条音轨，选一条想留的，其它音轨（含视频流、字幕）原样保留、不重新编码，速度很快。</p>

  <div class="card">
    <div class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
      <p>把视频拖到这里，或点击选择文件<br>MP4 / MKV / MOV / WebM 都行</p>
    </div>
    <div class="fname" id="fname" style="display:none;"></div>
    <input type="file" id="fileInput" accept="video/*,.mkv">
    <div class="warn" id="sizeWarn">
      文件比较大，全程要塞进浏览器内存里处理，可能会慢、占内存高，甚至卡住标签页。建议先在小文件上试一遍流程，心里有数。
    </div>
    <button class="btn primary" id="probeBtn" disabled style="margin-top:14px;">检测音轨</button>
    <div class="status" id="probeStatus"></div>
    <div class="log" id="probeLog"></div>
  </div>

  <div class="card" id="trackCard" style="display:none;">
    <div style="font-weight:700; font-size:.9em; margin-bottom:10px;">选一条要保留的音轨</div>
    <div id="trackList"></div>
    <button class="btn primary" id="extractBtn">提取并下载</button>
    <div class="progress-bar" id="progressBar"><div id="progressFill"></div></div>
    <div class="status" id="extractStatus"></div>
  </div>
</div>

<script type="module">
const $ = s => document.querySelector(s);

let ffmpegInstance = null, ffmpegLoadingPromise = null, ffLogBuf = "";
async function loadFFmpeg(onProgress){
  if(ffmpegInstance) return ffmpegInstance;
  if(ffmpegLoadingPromise) return ffmpegLoadingPromise;
  ffmpegLoadingPromise = (async () => {
    const { FFmpeg } = await import("https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js");
    const { toBlobURL } = await import("https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js");
    const ff = new FFmpeg();
    ff.on("log", ({ message }) => { ffLogBuf += message + "\n"; });
    if(onProgress) ff.on("progress", onProgress);
    const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm";
    // file:// 打开时页面 origin 是 "null"，不能直接从跨域 URL 建 Worker，
    // 把 worker.js 也拉成 blob URL 绕开这个限制。
    const classWorkerURL = await toBlobURL("https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js", "text/javascript");
    await ff.load({
      coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
      wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm"),
      classWorkerURL,
    });
    ffmpegInstance = ff;
    return ff;
  })();
  return ffmpegLoadingPromise;
}

function extOf(name){ const m = name.match(/\.[^.]+$/); return m ? m[0] : ".mp4"; }
function fmtSize(bytes){
  if(bytes > 1e9) return (bytes/1e9).toFixed(2) + " GB";
  return (bytes/1e6).toFixed(1) + " MB";
}

let currentFile = null;
let tracks = [];
let selectedIdx = 0;

const drop = $("#drop"), fileInput = $("#fileInput"), fnameEl = $("#fname");
const probeBtn = $("#probeBtn"), probeStatus = $("#probeStatus"), probeLog = $("#probeLog");
const sizeWarn = $("#sizeWarn");
const trackCard = $("#trackCard"), trackList = $("#trackList");
const extractBtn = $("#extractBtn"), extractStatus = $("#extractStatus");
const progressBar = $("#progressBar"), progressFill = $("#progressFill");

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("dragover"); });
drop.addEventListener("dragleave", () => drop.classList.remove("dragover"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("dragover");
  if(e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", e => { if(e.target.files.length) setFile(e.target.files[0]); });

function setFile(file){
  currentFile = file;
  fnameEl.style.display = "block";
  fnameEl.textContent = `${file.name}  ·  ${fmtSize(file.size)}`;
  probeBtn.disabled = false;
  probeStatus.textContent = "";
  probeStatus.className = "status";
  probeLog.classList.remove("show");
  trackCard.style.display = "none";
  sizeWarn.classList.toggle("show", file.size > 1.5e9);
}

probeBtn.addEventListener("click", async () => {
  if(!currentFile) return;
  probeBtn.disabled = true;
  probeStatus.className = "status";
  probeStatus.textContent = "加载解码器中（首次要下载约 30MB，耐心等）…";
  try{
    const ff = await loadFFmpeg();
    probeStatus.textContent = "读取文件中…";
    const inName = "probe_in" + extOf(currentFile.name);
    try{ await ff.deleteFile(inName); }catch(e){}
    await ff.writeFile(inName, new Uint8Array(await currentFile.arrayBuffer()));
    ffLogBuf = "";
    probeStatus.textContent = "分析音轨中…";
    try{ await ff.exec(["-analyzeduration","100000000","-probesize","100000000","-i", inName]); }
    catch(e){ /* -i 不给输出必然报错，探测信息已经在日志里了 */ }
    try{ await ff.deleteFile(inName); }catch(e){}

    const lineRe = /Stream #\d+:\d+[^\n]*:\s*Audio:[^\n]*/g;
    const lines = ffLogBuf.match(lineRe) || [];
    tracks = lines.map(line => {
      const langMatch = line.match(/\((\w{2,3})\)\s*:/);
      const codecMatch = line.match(/Audio:\s*([^,\n]+)/);
      const rateMatch = line.match(/(\d+)\s*Hz/);
      const chMatch = line.match(/Hz,\s*([^,]+),/);
      return {
        lang: langMatch ? langMatch[1] : "未知语言",
        codec: codecMatch ? codecMatch[1].trim() : "?",
        rate: rateMatch ? rateMatch[1] + " Hz" : "",
        ch: chMatch ? chMatch[1].trim() : "",
      };
    });

    probeLog.textContent = ffLogBuf;
    if(tracks.length === 0){
      probeStatus.className = "status err";
      probeStatus.textContent = "没检测到音轨，展开下面日志看看原始输出（可能是编码太冷门）";
      probeLog.classList.add("show");
    } else {
      probeStatus.className = "status ok";
      probeStatus.textContent = `检测到 ${tracks.length} 条音轨`;
      renderTracks();
      trackCard.style.display = "block";
      trackCard.scrollIntoView({ behavior:"smooth", block:"nearest" });
    }
  }catch(err){
    probeStatus.className = "status err";
    probeStatus.textContent = "检测失败：" + err.message;
    console.error(err);
  }finally{
    probeBtn.disabled = false;
  }
});

function renderTracks(){
  trackList.innerHTML = "";
  tracks.forEach((tr, idx) => {
    const row = document.createElement("label");
    row.className = "track" + (idx === selectedIdx ? " active" : "");
    row.innerHTML = `
      <input type="radio" name="track" ${idx === selectedIdx ? "checked" : ""}>
      <div class="meta">
        <div class="t1">音轨 ${idx+1} · ${tr.lang}</div>
        <div class="t2">${tr.codec}${tr.rate ? " · " + tr.rate : ""}${tr.ch ? " · " + tr.ch : ""}</div>
      </div>`;
    row.querySelector("input").addEventListener("change", () => {
      selectedIdx = idx;
      trackList.querySelectorAll(".track").forEach(el => el.classList.remove("active"));
      row.classList.add("active");
    });
    trackList.appendChild(row);
  });
}

extractBtn.addEventListener("click", async () => {
  if(!currentFile || !tracks.length) return;
  extractBtn.disabled = true;
  extractStatus.className = "status";
  extractStatus.textContent = "处理中…（-c copy 不重新编码，只是重新封装，一般比较快）";
  progressBar.classList.add("show");
  progressFill.style.width = "2%";
  try{
    const ff = await loadFFmpeg(({ progress }) => {
      const pct = Math.min(99, Math.max(2, Math.round((progress || 0) * 100)));
      progressFill.style.width = pct + "%";
    });
    const ext = extOf(currentFile.name);
    const inName = "in" + ext, outName = "out" + ext;
    try{ await ff.deleteFile(inName); }catch(e){}
    try{ await ff.deleteFile(outName); }catch(e){}
    await ff.writeFile(inName, new Uint8Array(await currentFile.arrayBuffer()));
    await ff.exec(["-i", inName, "-map","0:v?","-map",`0:a:${selectedIdx}`,"-map","0:s?","-c","copy","-y", outName]);
    const data = await ff.readFile(outName);
    const blob = new Blob([data.buffer], { type: "video/" + ext.slice(1) });
    try{ await ff.deleteFile(inName); await ff.deleteFile(outName); }catch(e){}

    progressFill.style.width = "100%";
    const url = URL.createObjectURL(blob);
    const outFileName = currentFile.name.replace(/\.[^.]+$/, "") + "_音轨" + (selectedIdx+1) + ext;
    const a = document.createElement("a");
    a.href = url; a.download = outFileName; a.className = "dl";
    a.click();
    URL.revokeObjectURL(url);

    extractStatus.className = "status ok";
    extractStatus.textContent = `完成，已下载 ${outFileName}`;
  }catch(err){
    extractStatus.className = "status err";
    extractStatus.textContent = "处理失败：" + err.message;
    console.error(err);
  }finally{
    extractBtn.disabled = false;
  }
});
</script>
</body>
</html>
